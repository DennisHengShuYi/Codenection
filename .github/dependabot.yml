version: 2
updates:
  # The npm dependency tree. Every update Dependabot opens arrives as a pull request, so
  # it goes through the same required CI check as human work -- which is the point: an
  # update that breaks the build blocks itself instead of landing quietly.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a release sit for a week before proposing it. A malicious or broken publish is
    # usually caught and yanked within days; this repository does not need to be the one
    # that finds out.
    cooldown:
      default-days: 7
    # Grouped so a week's updates arrive as two reviewable pull requests rather than a
    # dozen. Dev dependencies are separated from runtime ones because they carry different
    # risk: a bad test-runner bump breaks CI, a bad runtime bump breaks users.
    groups:
      # vitest and its coverage plugin pin each other exactly -- @vitest/coverage-v8@X
      # declares a peer dependency on vitest@X. A pull request that moves one without the
      # other cannot even install: `npm ci` fails on ERESOLVE before a single test runs.
      # Listed first so it wins over the groups below, and covering majors on purpose --
      # for this pair, two separate pull requests are not two reviewable changes, they are
      # two halves of one change that only works whole.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["major", "minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Every other major version stays ungrouped and arrives one per pull request -- those
    # are the ones that need reading, not batching. The vitest group above is the single
    # exception, for the peer-dependency reason given there.
    open-pull-requests-limit: 10

  # The actions used by the workflows themselves. These are pinned by commit SHA in
  # ci.yml, which means they cannot drift on their own -- and equally cannot pick up a
  # security fix on their own. This is what moves those pins forward.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: ["minor", "patch"]
